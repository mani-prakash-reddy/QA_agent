# Development stack. Start with `docker compose watch` (or `docker compose up --watch`)
# to sync code changes into the containers and rebuild on dependency changes.
services:

  db:
    build: ./db
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DESIGN=pepa-linha-dark

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Run migrations + create the first superuser, then start the reloading dev server.
    command: bash -c "bash scripts/prestart.sh && exec fastapi dev --host 0.0.0.0"
    environment:
      FASTAPI_ENV: development
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      FRONTEND_HOST: http://localhost:5173
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      REDIS_URL: redis://redis:6379
      ARTIFACT_DIR: /data/artifacts
      # Encrypts role credentials at rest (Fernet key; see .env.example). Not an LLM secret.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      ALLOWED_TARGET_HOSTS: ${ALLOWED_TARGET_HOSTS:-localhost,127.0.0.1,frontend,juice-shop,demo-leave,demo-stock,demo-help,demo-testrail-mock}
      # Email is disabled (no SMTP_HOST). To enable it, set SMTP_* and EMAILS_FROM_EMAIL here.
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - artifacts:/data/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/backend/app
          ignore:
            - __pycache__
            - frontend
        - path: ./backend/tests
          action: sync
          target: /app/backend/tests
          ignore:
            - __pycache__
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild

  # Runs agent runs (LangGraph + Playwright). Holds the LLM keys; the API does not.
  # Scale with `docker compose up --scale worker=N`.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.qa.jobs.worker.WorkerSettings
    volumes:
      - artifacts:/data/artifacts
    environment:
      FASTAPI_ENV: development
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      REDIS_URL: redis://redis:6379
      ARTIFACT_DIR: /data/artifacts
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      ALLOWED_TARGET_HOSTS: ${ALLOWED_TARGET_HOSTS:-localhost,127.0.0.1,frontend,juice-shop}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-openai/gpt-oss-20b}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-liquid/lfm-2.5-embedding-350m:free}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    develop:
      watch:
        - path: ./backend/app
          action: sync+restart
          target: /app/backend/app
          ignore:
            - __pycache__
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./uv.lock
          action: rebuild

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      # Used by the browser, so it must be reachable from the host.
      VITE_API_URL: http://localhost:8000
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app/frontend
          ignore:
            - node_modules
            - dist
            - test-results
            - blob-report
            - playwright-report
        - path: ./frontend/package.json
          action: rebuild
        - path: ./bun.lock
          action: rebuild

  # End-to-end tests: `docker compose --profile test run --rm playwright`
  playwright:
    profiles: [test]
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
    environment:
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      - PLAYWRIGHT_BASE_URL=http://frontend:5173
      - VITE_API_URL=http://backend:8000
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
    ports:
      - 9323:9323

  # --- Demo / test target applications (never started by default) ---
  # `docker compose --profile demo-juice up -d juice-shop`
  # Intentionally vulnerable app: keep it on the compose network / localhost only.
  juice-shop:
    profiles: [demo-juice]
    image: bkimminich/juice-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  # Redmine: project management with roles, issues, forms and an admin area (SQLite, one container).
  # `docker compose --profile demo-redmine up -d redmine`; accounts are created by the developer.
  redmine:
    profiles: [demo-redmine]
    image: redmine:6
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"

  # Gitea: a git forge (SQLite, install wizard skipped). `docker compose --profile demo-gitea up -d gitea`
  gitea:
    profiles: [demo-gitea]
    image: gitea/gitea:1.24
    restart: unless-stopped
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: "http://localhost:3002/"
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__server__OFFLINE_MODE: "true"
    ports:
      - "127.0.0.1:3002:3000"

  # --- Purpose-built test applications (demo/apps): known rules, roles, MFA, expiring sessions ---
  # Accounts come from DEMO_USERS (local demo logins, listed in demo/apps/README.md).
  demo-leave:
    profiles: [demo-leave]
    build: ./demo/apps
    environment:
      APP: leavetrack
      DEMO_USERS: '[{"email":"employee@demo.test","password":"Employee-Demo-1","role":"employee","name":"Uma User"},{"email":"manager@demo.test","password":"Manager-Demo-1","role":"manager","name":"Mia Manager"},{"email":"hr@demo.test","password":"Hr-Demo-1","role":"hr","name":"Hana HR","totp_seed":"JBSWY3DPEHPK3PXP"}]'
    ports:
      - "127.0.0.1:3101:3000"
  demo-stock:
    profiles: [demo-stock]
    build: ./demo/apps
    environment:
      APP: stockroom
      DEMO_USERS: '[{"email":"admin@demo.test","password":"Admin-Demo-1","role":"admin","name":"Alex Admin"},{"email":"clerk@demo.test","password":"Clerk-Demo-1","role":"clerk","name":"Cleo Clerk"},{"email":"viewer@demo.test","password":"Viewer-Demo-1","role":"viewer","name":"Vic Viewer"}]'
    ports:
      - "127.0.0.1:3102:3000"
  # A stand-in for TestRail's API so the integration can be tried without an account (not TestRail).
  # URL http://demo-testrail-mock:3000 (worker/backend) or http://localhost:3104; login qa@demo.test / mock-key.
  demo-testrail-mock:
    profiles: [demo-testrail-mock]
    build: ./demo/apps
    environment:
      APP: mocktestrail
    ports:
      - "127.0.0.1:3104:3000"
  demo-help:
    profiles: [demo-help]
    build: ./demo/apps
    environment:
      APP: helpdesk
      SESSION_TTL: ${DEMO_HELP_SESSION_TTL:-120}
      DEMO_USERS: '[{"email":"customer@demo.test","password":"Customer-Demo-1","role":"customer","name":"Cam Customer"},{"email":"agent@demo.test","password":"Agent-Demo-1","role":"agent","name":"Ada Agent"},{"email":"admin@demo.test","password":"Admin-Demo-1","role":"admin","name":"Alex Admin"}]'
    ports:
      - "127.0.0.1:3103:3000"

volumes:
  app-db-data:
  artifacts:
